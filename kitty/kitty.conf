
# ----- Основные настройки -----
font_family      JetBrains Mono
font_size        13.0
cursor_shape     beam
shell_integration enabled


# Black & White палитра
background #000000
foreground #ffffff

selection_background #ffffff
selection_foreground #000000

# Цвета для выделения (акцент — белый на черном)
cursor            #ffffff
cursor_text_color #000000

# Цвета для стандартных терминальных цветов (16 цветов)
# Все в черно-белой гамме, чтобы не вырвиглазно
color0  #000000
color1  #ffffff
color2  #ffffff
color3  #ffffff
color4  #ffffff
color5  #ffffff
color6  #ffffff
color7  #aaaaaa
color8  #555555
color9  #ffffff
color10 #ffffff
color11 #ffffff
color12 #ffffff
color13 #ffffff
color14 #ffffff
color15 #ffffff

# ----- Визуальное оформление -----
# Убираем всё лишнее
hide_window_decorations yes      # убирает рамки и заголовок окна
remember_window_size   yes
initial_window_width  900
initial_window_height 600

# ----- Поведение -----
mouse_hide_wait 2.0
url_color #ffffff                # ссылки белые (для контраста)
url_style curly

# ----- Настройки под Linux (X11 / Wayland) -----
# Опционально: если используешь compositor, чтобы окно было красивым
linux_display_server x11
# Если Wayland — раскомментируй:
# linux_display_server wayland

# Плавный скроллинг (экспериментально)
# Работает не на всех системах, если лагает — закомментируй
# wheel_scroll_multiplier 5.0
# touch_scroll_multiplier 5.0
